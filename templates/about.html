{% extends "index.html" %}

{% block content %}
    <div class="about">
        {# Check for page or section extra image configuration #}
        {% if page.extra.image %}
            <img src="{{ get_url(path=page.extra.image) }}" alt="{{ page.title }}" class="about-banner">
        {% elif section.extra.image %}
            <img src="{{ get_url(path=section.extra.image) }}" alt="{{ section.title }}" class="about-banner">
        {% endif %}

        {% if page.content %}
            {{ page.content | safe }}
        {% else %}
            {{ section.content | safe }}
        {% endif %}
    </div>
{% endblock content %}
